[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airscope"
version = "1.0.0"
description = "Analizador WiFi profesional para Linux (dBm, canales, DFS, Wi-Fi 4/5/6, espectro, radar)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.4"]

[project.scripts]
airscope = "airscope.app:main"

[tool.setuptools]
packages = ["airscope"]

[tool.setuptools.package-data]
airscope = ["*.svg"]
